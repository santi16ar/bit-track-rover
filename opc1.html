<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles2.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Bit-track rover</title>
</head>
<body>
    <header class="header">
        <a href="#" class="logo"><img src="coche-auto-conducido.png" alt="" height="36px">Bit-track rover</a>

        <nav class="nav">
            <a href="index.html">home</a>
        </nav>
    </header>

    <main class="login-page">

        <div class="login-intro">
            <h2>Bienvenido a Bit-Track</h2>
            <p>Iniciá sesión para acceder al panel de tu institución</p>
        </div>

        <div class="login-row">
            <div class="wrapper-login">
            <h2>CREA UNA CUENTA</h2>
            <h4>Datos institucionales</h4>
            <form action="#">
                <div class="input-box">
                    <input type="text" required>
                    <label>nombre del hospital o clinica</label>
                </div>
                <div class="input-box">
                    <input type="text" required>
                    <label>pais y ciudad</label>
                </div>
                <div class="input-box">
                    <input type="number" min="0" max="7" required>
                    <label>cantidad de rovers que necesita</label>
                </div>
            <h4>datos del usuario</h4>
            <div class="input-box">
                    <input type="text" required>
                    <label>nombre y apellido</label>
                </div>
                <div class="input-box">
                    <input type="text" required>
                    <label>rol en la institucion</label>
                </div>
                <div class="input-box">
                    <input type="email" required>
                    <label>escribe tu email</label>
                </div>
                <div class="input-box">
                    <input type="password" required>
                    <label>escribe tu contraseña</label>
                </div>
                <button class="btn">empezar</button>
            </form>
        </div>

        <img src="img1.jpg" alt="" width="700px" class="img-login">
        </div>
    </main>

</body>
</html>
