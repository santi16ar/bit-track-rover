<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style_mirover.css?v=3">
    <title>Mi Rover — Bit-Track</title>
</head>
<body>

<header class="header">
    <a href="home.html" class="logo" title="Inicio" aria-label="Inicio — Bit-track rover">
        <img src="logo.png-removebg-preview.png" alt="">Bit-track rover
    </a>
    <nav>
        <a href="home.html">Panel</a>
        <a href="homedp.html">Mis datos</a>
        <button class="btn-cerrar" id="btn-cerrar">Cerrar sesión</button>
    </nav>
</header>

<main>
    <p class="page-title">Panel de control</p>
    <h1 class="rover-nombre" id="rover-codigo">ROB-000</h1>
    <p class="rover-subtitulo" id="rover-modelo">Cargando datos del rover...</p>

    <div class="grid-main">
        <div class="card card-hardware">
            <div class="hw-item">
                <p class="hw-label">Microcontrolador</p>
                <p class="hw-valor">ESP32</p>
                <p class="hw-sub">Dual-core 240MHz</p>
            </div>
            <div class="hw-item">
                <p class="hw-label">Sensor principal</p>
                <p class="hw-valor">Infrarrojo</p>
                <p class="hw-sub">Seguimiento de línea</p>
            </div>
            <div class="hw-item">
                <p class="hw-label">Conectividad</p>
                <p class="hw-valor">WiFi 802.11</p>
                <p class="hw-sub">2.4GHz integrado</p>
            </div>
            <div class="hw-item">
                <p class="hw-label">Autonomía</p>
                <p class="hw-valor">12 horas</p>
                <p class="hw-sub">Por carga completa</p>
            </div>
        </div>
        <div class="card card-foto-rover">
            <img src="img1.jpg" alt="Rover">
        </div>
    </div>
</main>

<script>
    const usuarioGuardado = sessionStorage.getItem("usuario");
    if (!usuarioGuardado) window.location.href = "index.html";
    const usuario = JSON.parse(usuarioGuardado);

    document.getElementById("rover-codigo").textContent = usuario.robot_codigo || "Sin rover";
    document.getElementById("rover-modelo").textContent = usuario.robot_modelo
        ? `Modelo: ${usuario.robot_modelo} — Hospital: ${usuario.hospital}`
        : "Sin rover asignado";

    document.getElementById("btn-cerrar").addEventListener("click", () => {
        sessionStorage.removeItem("usuario");
        window.location.href = "index.html";
    });
</script>

</body>
</html>
