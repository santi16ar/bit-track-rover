<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="logo.png-removebg-preview.png" type="image/x-icon">
    <link rel="stylesheet" href="stylesdp.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Mis datos — Bit-Track Rover</title>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">
            <img src="logo.png-removebg-preview.png" alt="" height="36px">Bit-track rover
        </a>
        <nav class="nav">
            <a href="home.html">Panel</a>
            <a href="homemirover.html">Mi rover</a>
            <button class="btn-cerrar" id="btn-cerrar" style="background:linear-gradient(135deg,#e11d48,#be123c);color:#fff;border:none;padding:9px 20px;border-radius:30px;cursor:pointer;font-weight:600;font-size:.9em;margin-left:8px">Cerrar sesión</button>
        </nav>
    </header>

    <main class="home-page">
        <h1 class="bienvenido anim">Bienvenido, <span id="nombre-usuario">...</span></h1>
        <p class="subtitulo anim" style="transition-delay:.1s">Panel de tu institución</p>

        <div class="panel">
            <div class="card anim-left" style="transition-delay:.1s">
                <h3>Datos del usuario</h3>
                <div class="dato">
                    <div class="dato-label">Nombre completo</div>
                    <div class="dato-valor" id="d-nombre">—</div>
                </div>
                <div class="dato">
                    <div class="dato-label">Email</div>
                    <div class="dato-valor" id="d-email">—</div>
                </div>
                <div class="dato">
                    <div class="dato-label">Rover asignado</div>
                    <div class="dato-valor" id="d-rover">—</div>
                </div>
            </div>

            <div class="card anim-left" style="transition-delay:.25s">
                <h3>Datos institucionales</h3>
                <div class="dato">
                    <div class="dato-label">Hospital o clínica</div>
                    <div class="dato-valor" id="d-hospital">—</div>
                </div>
                <div class="dato">
                    <div class="dato-label">Ciudad</div>
                    <div class="dato-valor" id="d-ciudad">—</div>
                </div>
                <div class="dato">
                    <div class="dato-label">Código del rover</div>
                    <div class="dato-valor" id="d-modelo">—</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Proteger página
        const usuarioGuardado = sessionStorage.getItem("usuario");
        if (!usuarioGuardado) window.location.href = "index.html";
        const u = JSON.parse(usuarioGuardado);

        // Llenar datos
        document.getElementById("nombre-usuario").textContent = u.nombre;
        document.getElementById("d-nombre").textContent   = u.nombre;
        document.getElementById("d-email").textContent    = u.email;
        document.getElementById("d-rover").textContent    = u.robot_codigo  || "sin asignar";
        document.getElementById("d-hospital").textContent = u.hospital      || "—";
        document.getElementById("d-ciudad").textContent   = u.ciudad        || "—";
        document.getElementById("d-modelo").textContent   = u.robot_codigo  || "—";

        const btnCerrar = document.getElementById("btn-cerrar");
        if (btnCerrar) btnCerrar.addEventListener("click", () => {
            sessionStorage.removeItem("usuario");
            window.location.href = "index.html";
        });

        // Fallback: si el observer falla, mostrar igual
        setTimeout(() => {
            document.querySelectorAll(".anim, .anim-left").forEach(el => el.classList.add("visible"));
        }, 800);

        // ANIMACIONES
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add("visible");
            });
        }, { threshold: 0.1 });

        document.querySelectorAll(".anim, .anim-left").forEach(el => observer.observe(el));
    </script>
</body>
</html>
