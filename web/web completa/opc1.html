<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles2.css">
     <link rel="shortcut icon" href="logo.png-removebg-preview.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Crear cuenta — Bit-Track Rover</title>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">
            <img src="logo.png-removebg-preview.png" alt="" height="55px">Bit-track rover
        </a>
        <nav class="nav">
            <a href="index.html">home</a>
        </nav>
    </header>

    <main class="login-page">
        <div class="login-intro">
            <h2>Comenzá a optimizar la logística de tu hospital</h2>
            <p>Creá la cuenta de tu institución para acceder a Bit-Track Rover.</p>
        </div>

        <div class="login-row">
            <div class="wrapper-login">
                <h2>CREA UNA CUENTA</h2>

                <div id="reg-error" style="display:none;color:#e74c3c;font-size:.9em;margin-bottom:10px;text-align:center"></div>

                <p class="seccion-label">Datos institucionales</p>

                <div class="input-box">
                    <select id="hospital" required>
                        <option value="" disabled selected>cargando hospitales...</option>
                    </select>
                </div>

                <p class="seccion-label">Datos del usuario</p>

                <div class="input-box">
                    <input type="text" id="nombre" required minlength="1">
                    <label>nombre y apellido</label>
                </div>
                <div class="input-box">
                    <input type="email" id="reg-email" required>
                    <label>escribe tu email</label>
                </div>
                <div class="input-box">
                    <input type="password" id="reg-password" required minlength="6">
                    <label>escribe tu contraseña</label>
                </div>

                <button class="btn" id="btn-registro">crear cuenta</button>
                <p style="text-align:center; margin-top:16px; font-size:.9em;">
                    ¿ya tenés cuenta? <a href="index.html#login" style="color:#0a3d62; font-weight:600;">iniciá sesión</a>
                </p>
            </div>

            <img src="img1.jpg" alt="" class="login-img">
        </div>
    </main>

    <script>
        const API = "api.php";

        async function cargarHospitales() {
            const select = document.getElementById("hospital");
            try {
                const res  = await fetch(`${API}?resource=hospitales`);
                const data = await res.json();
                if (!data.length) {
                    select.innerHTML = `<option value="" disabled selected>no hay hospitales cargados</option>`;
                    return;
                }
                select.innerHTML = `<option value="" disabled selected>seleccioná tu hospital</option>`;
                data.forEach(h => {
                    const opt = document.createElement("option");
                    opt.value       = h.id_hospital;
                    opt.textContent = `${h.nombre} — ${h.ciudad}`;
                    select.appendChild(opt);
                });
            } catch (e) {
                select.innerHTML = `<option value="" disabled selected>error al cargar hospitales</option>`;
            }
        }

        document.getElementById("btn-registro").addEventListener("click", async () => {
            const nombre     = document.getElementById("nombre").value.trim();
            const email      = document.getElementById("reg-email").value.trim();
            const password   = document.getElementById("reg-password").value;
            const hospitalId = document.getElementById("hospital").value;
            const errorEl    = document.getElementById("reg-error");
            const btn        = document.getElementById("btn-registro");

            if (!nombre || !email || !password || !hospitalId) {
                errorEl.textContent = "Por favor completá todos los campos.";
                errorEl.style.display = "block";
                return;
            }

            errorEl.style.display = "none";
            btn.textContent = "creando cuenta...";
            btn.disabled = true;

            try {
                const res  = await fetch(`${API}?resource=registro`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nombre, email, password, fk_hospital: hospitalId })
                });
                const data = await res.json();

                if (data.ok) {
                    // Mostrar el rover asignado antes de redirigir
                    alert(`¡Cuenta creada! Tu rover asignado es: ${data.rover_codigo}. Ahora iniciá sesión.`);
                } else {
                    errorEl.textContent = data.error || "Error al registrarse.";
                    errorEl.style.display = "block";
                }
            } catch (e) {
                errorEl.textContent = "Error de conexión con el servidor.";
                errorEl.style.display = "block";
            }

            btn.textContent = "crear cuenta";
            btn.disabled = false;
        });

        cargarHospitales();
    </script>
</body>
</html>
