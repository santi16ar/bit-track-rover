<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles2.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Crear cuenta — Bit-Track Rover</title>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">
            <img src="coche-auto-conducido.png" alt="" height="36px">Bit-track rover
        </a>
        <nav class="nav">
            <a href="index.html">home</a>
        </nav>
    </header>

    <main class="login-page">
        <div class="login-intro">
            <h2>Creá tu cuenta</h2>
            <p>Registrá tu institución y comenzá a usar Bit-Track Rover</p>
        </div>

        <div class="login-row">
            <div class="wrapper-login">
                <h2>CREA UNA CUENTA</h2>

                <p class="seccion-label">Datos institucionales</p>

                <div class="input-box">
                    <input type="text" id="hospital" required minlength="1">
                    <label>nombre del hospital o clínica</label>
                </div>
                <div class="input-box">
                    <input type="text" id="ciudad" required minlength="1">
                    <label>país y ciudad</label>
                </div>
                <div class="input-box">
                    <input type="number" id="rovers" required min="1">
                    <label>cantidad de rovers que necesita</label>
                </div>

                <p class="seccion-label">Datos del usuario</p>

                <div class="input-box">
                    <input type="text" id="nombre" required minlength="1">
                    <label>nombre y apellido</label>
                </div>
                <div class="input-box">
                    <input type="text" id="rol" required minlength="1">
                    <label>rol en la institución</label>
                </div>
                <div class="input-box">
                    <input type="email" id="reg-email" required>
                    <label>escribe tu email</label>
                </div>
                <div class="input-box">
                    <input type="password" id="reg-password" required minlength="6">
                    <label>escribe tu contraseña</label>
                </div>

                <button class="btn" id="btn-registro">crear cuenta</button>
                <p style="text-align:center; margin-top:16px; font-size:.9em;">
                    ¿ya tenés cuenta? <a href="index.html#login" style="color:#0a3d62; font-weight:600;">iniciá sesión</a>
                </p>
            </div>

            <img src="img1.jpg" alt="" class="login-img">
        </div>
    </main>

    <script type="module">
        import { auth } from "./firebase.js";
        import {
            createUserWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            getFirestore, doc, setDoc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore();

        document.getElementById("btn-registro").addEventListener("click", async () => {
            const email    = document.getElementById("reg-email").value;
            const password = document.getElementById("reg-password").value;
            const nombre   = document.getElementById("nombre").value;
            const hospital = document.getElementById("hospital").value;
            const ciudad   = document.getElementById("ciudad").value;
            const rovers   = document.getElementById("rovers").value;
            const rol      = document.getElementById("rol").value;

            if (!nombre || !hospital || !ciudad || !rovers || !rol) {
                alert("Por favor completá todos los campos.");
                return;
            }

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);

                // guarda los datos extra en Firestore
                await setDoc(doc(db, "usuarios", cred.user.uid), {
                    nombre, hospital, ciudad, rovers, rol, email
                });

                window.location.href = "home.html";
            } catch (error) {
                alert("Error: " + error.message);
            }
        });
    </script>
</body>
</html>
